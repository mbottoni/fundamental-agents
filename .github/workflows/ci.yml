name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Backend Tests ──────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # The queue claims jobs with FOR UPDATE SKIP LOCKED, which SQLite cannot
    # express. Without a real PostgreSQL the concurrency tests would skip, and
    # a skipped test is not a test.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stock-analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d stock-analyzer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --tb=short -q
        env:
          SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long-ok
          DATABASE_URL: sqlite:///./test.db
          FINANCIAL_MODELING_PREP_API_KEY: test_key
          NEWS_API_KEY: test_key
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
          TEST_POSTGRES_URL: postgresql://user:password@localhost:5432/stock-analyzer

      # Two things only PostgreSQL can show: that the queue never hands one job
      # to two workers, and that the migrations build exactly the schema the
      # models describe. A skipped test is not a test.
      - name: Fail if the PostgreSQL tests were skipped
        run: |
          if pytest tests/test_job_queue_postgres.py tests/test_migrations.py -q --tb=no -rs 2>&1 | grep -q "TEST_POSTGRES_URL is not set"; then
            echo "::error::The PostgreSQL tests skipped — TEST_POSTGRES_URL was not set."
            exit 1
          fi
        env:
          SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long-ok
          DATABASE_URL: sqlite:///./test.db
          FINANCIAL_MODELING_PREP_API_KEY: test_key
          NEWS_API_KEY: test_key
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
          TEST_POSTGRES_URL: postgresql://user:password@localhost:5432/stock-analyzer

  # ── Frontend Lint + Build ──────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  # ── Generated Types Drift Check ────────────────────────────
  # The report chart payload and every API shape are declared once, in the
  # backend. `frontend/src/types/api.ts` is generated from the OpenAPI document
  # and committed; if a schema changes without regenerating, this fails rather
  # than letting the frontend silently read fields that no longer exist.
  types-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Regenerate types from the OpenAPI schema
        run: |
          python scripts/dump_openapi.py openapi.json
          cd ../frontend && npm run gen:types
        working-directory: ./backend

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- frontend/src/types/api.ts; then
            echo ""
            echo "::error::frontend/src/types/api.ts is out of date."
            echo "The backend schema changed without regenerating the frontend types."
            echo "Run 'make gen-types' and commit the result."
            exit 1
          fi

      - name: Type-check the frontend against them
        run: npx tsc --noEmit
        working-directory: ./frontend

  # ── Images: build, start the real stack, then (on main) push ──
  # Built on every run, pull requests included, so a broken Dockerfile or a
  # stack that cannot start fails the pull request. Pushed only from main,
  # and only after the smoke test: an image that has not been seen to work
  # never reaches the registry.
  images:
    needs: [backend-test, frontend-build, types-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/${{ github.repository_owner }}/fundamental-agents
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: APP_VERSION=${{ github.sha }}
          load: true
          tags: |
            ${{ env.REPO }}-api:${{ github.sha }}
            ${{ env.REPO }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: |
            ${{ env.REPO }}-web:${{ github.sha }}
            ${{ env.REPO }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Starts docker-compose.prod.yml itself, behind Caddy, with production
      # settings, and requires /healthz to report ok for this commit, the
      # routes to resolve, an account to register and sign in, and every
      # container to run as a non-root user.
      - name: Smoke-test the production stack
        run: ops/smoke-test.sh "${{ github.sha }}" "${{ github.sha }}"

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push --all-tags "$REPO-api"
          docker push --all-tags "$REPO-web"

  # ── Deploy (main only) ─────────────────────────────────────
  # Ships the images just pushed to the server. The server holds only
  # docker-compose.prod.yml, the Caddyfile and .env.prod; everything else
  # comes from this repository. Skipped until a server is configured: set the
  # DEPLOY_URL variable (and the three DEPLOY_* secrets) to turn it on.
  deploy:
    needs: images
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_URL != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The same steps the manual deploy/rollback workflow runs (deploy.yml).
      - uses: ./.github/actions/deploy
        with:
          image-tag: ${{ github.sha }}
          host: ${{ secrets.DEPLOY_HOST }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          registry-user: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          health-url: ${{ vars.DEPLOY_URL }}
