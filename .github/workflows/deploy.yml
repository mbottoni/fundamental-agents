name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ──────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # The queue claims jobs with FOR UPDATE SKIP LOCKED, which SQLite cannot
    # express. Without a real PostgreSQL the concurrency tests would skip, and
    # a skipped test is not a test.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stock-analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d stock-analyzer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --tb=short -q
        env:
          SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long-ok
          DATABASE_URL: sqlite:///./test.db
          FINANCIAL_MODELING_PREP_API_KEY: test_key
          NEWS_API_KEY: test_key
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
          TEST_POSTGRES_URL: postgresql://user:password@localhost:5432/stock-analyzer

      - name: Fail if the PostgreSQL queue tests were skipped
        run: |
          if pytest tests/test_job_queue_postgres.py -q --tb=no 2>&1 | grep -q "skipped"; then
            echo "::error::The queue concurrency tests skipped — PostgreSQL was not reachable."
            exit 1
          fi
        env:
          SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long-ok
          DATABASE_URL: sqlite:///./test.db
          FINANCIAL_MODELING_PREP_API_KEY: test_key
          NEWS_API_KEY: test_key
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
          TEST_POSTGRES_URL: postgresql://user:password@localhost:5432/stock-analyzer

  # ── Frontend Lint + Build ──────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  # ── Docker Build + Push (only on main) ─────────────────────
  build-and-push:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stock-analyzer-backend:latest
            ghcr.io/${{ github.repository_owner }}/stock-analyzer-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stock-analyzer-frontend:latest
            ghcr.io/${{ github.repository_owner }}/stock-analyzer-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
