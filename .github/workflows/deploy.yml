name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ──────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --tb=short -q
        env:
          SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long-ok
          DATABASE_URL: sqlite:///./test.db
          FINANCIAL_MODELING_PREP_API_KEY: test_key
          NEWS_API_KEY: test_key
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake

  # ── Frontend Lint + Build ──────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  # ── Generated Types Drift Check ────────────────────────────
  # The report chart payload and every API shape are declared once, in the
  # backend. `frontend/src/types/api.ts` is generated from the OpenAPI document
  # and committed; if a schema changes without regenerating, this fails rather
  # than letting the frontend silently read fields that no longer exist.
  types-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Regenerate types from the OpenAPI schema
        run: |
          python scripts/dump_openapi.py openapi.json
          cd ../frontend && npm run gen:types
        working-directory: ./backend

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- frontend/src/types/api.ts; then
            echo ""
            echo "::error::frontend/src/types/api.ts is out of date."
            echo "The backend schema changed without regenerating the frontend types."
            echo "Run 'make gen-types' and commit the result."
            exit 1
          fi

      - name: Type-check the frontend against them
        run: npx tsc --noEmit
        working-directory: ./frontend

  # ── Docker Build + Push (only on main) ─────────────────────
  build-and-push:
    needs: [backend-test, frontend-build, types-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stock-analyzer-backend:latest
            ghcr.io/${{ github.repository_owner }}/stock-analyzer-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stock-analyzer-frontend:latest
            ghcr.io/${{ github.repository_owner }}/stock-analyzer-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
