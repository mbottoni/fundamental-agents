services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/stock-analyzer
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  db:
    # Same major version as production (docker-compose.prod.yml).
    image: postgres:17-alpine
    volumes:
      - postgres17_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=stock-analyzer
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stock-analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# A new volume name, because Postgres 17 cannot open the data directory the
# old `postgres_data` volume holds (written by Postgres 13). That volume is
# left untouched; remove it with `docker volume rm` once nothing in it matters.
volumes:
  postgres17_data:
